name: Desplegar BBBSC al VPS

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Escribe DESPLEGAR para confirmar
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bbbsc-production
  cancel-in-progress: false

jobs:
  validate:
    if: inputs.confirm_deploy == 'DESPLEGAR'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Publicar versión con reversión
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
      RELEASE_ID: ${{ github.sha }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Compilar frontend
        env:
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}
        run: |
          npm ci
          npm run build

      - name: Preparar acceso SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Validar destino y crear versión
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          test -n "$DEPLOY_PATH"
          case "$DEPLOY_PATH" in /www/wwwroot/*|/var/www/*) ;; *) echo "VPS_DEPLOY_PATH debe estar dentro de /www/wwwroot o /var/www"; exit 1;; esac
          printf '%s' "$DEPLOY_PATH" | grep -Eq '^/(www/wwwroot|var/www)/[A-Za-z0-9._/-]+$'
          ssh -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "set -eu; mkdir -p '$DEPLOY_PATH/releases/$RELEASE_ID/dist' '$DEPLOY_PATH/releases/$RELEASE_ID/server' '$DEPLOY_PATH/shared/server/data' '$DEPLOY_PATH/shared/server/uploads' '$DEPLOY_PATH/shared/server/backups'; test -s '$DEPLOY_PATH/shared/server/.env'"

      - name: Subir frontend y backend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete -e "ssh -p ${VPS_PORT:-22}" dist/ "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/releases/$RELEASE_ID/dist/"
          rsync -az --delete --exclude node_modules --exclude .env --exclude data --exclude uploads -e "ssh -p ${VPS_PORT:-22}" server/ "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/releases/$RELEASE_ID/server/"

      - name: Activar versión y reiniciar API
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "DEPLOY_PATH='$DEPLOY_PATH' RELEASE_ID='$RELEASE_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          release="$DEPLOY_PATH/releases/$RELEASE_ID"
          previous="$(readlink -f "$DEPLOY_PATH/current" 2>/dev/null || true)"
          database="$DEPLOY_PATH/shared/server/data/bbbsc.sqlite3"
          if [ -f "$database" ]; then
            cp -p "$database" "$DEPLOY_PATH/shared/server/backups/bbbsc-$(date +%Y%m%d-%H%M%S).sqlite3"
          fi
          ln -sfn "$DEPLOY_PATH/shared/server/.env" "$release/server/.env"
          ln -sfn "$DEPLOY_PATH/shared/server/data" "$release/server/data"
          ln -sfn "$DEPLOY_PATH/shared/server/uploads" "$release/server/uploads"
          cd "$release/server"
          npm ci --omit=dev
          ln -sfn "$release" "$DEPLOY_PATH/current.next"
          mv -Tf "$DEPLOY_PATH/current.next" "$DEPLOY_PATH/current"
          pm2 delete bbbsc-server >/dev/null 2>&1 || true
          cd "$DEPLOY_PATH/current/server" && pm2 start index.js --name bbbsc-server
          pm2 save
          api_ready=false
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:4000/api/health >/dev/null 2>&1; then
              api_ready=true
              break
            fi
            sleep 2
          done
          if [ "$api_ready" != "true" ]; then
            pm2 logs bbbsc-server --lines 100 --nostream || true
            if [ -n "$previous" ] && [ -d "$previous" ]; then
              ln -sfn "$previous" "$DEPLOY_PATH/current.next"
              mv -Tf "$DEPLOY_PATH/current.next" "$DEPLOY_PATH/current"
              pm2 delete bbbsc-server >/dev/null 2>&1 || true
              cd "$DEPLOY_PATH/current/server" && pm2 start index.js --name bbbsc-server
              pm2 save
            fi
            exit 1
          fi
          cd "$DEPLOY_PATH/releases"
          ls -1dt */ 2>/dev/null | tail -n +6 | while read -r old_release; do rm -rf -- "$DEPLOY_PATH/releases/${old_release%/}"; done
          cd "$DEPLOY_PATH/shared/server/backups"
          ls -1t *.sqlite3 2>/dev/null | tail -n +11 | while read -r old_backup; do rm -f -- "$old_backup"; done
          REMOTE

      - name: Verificar sitio público
        run: |
          curl --fail --silent --show-error --retry 4 --retry-delay 5 https://bbbsc.com/ >/dev/null
          curl --fail --silent --show-error --retry 4 --retry-delay 5 https://bbbsc.com/api/health >/dev/null
